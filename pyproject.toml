[project]
name = "longersession"
version = "0.1.0"
description = "超长 session 索引架构：单链表 session + 语义切割 + topic 索引"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
encoder = [
    "sentence-transformers>=2.6",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longersession"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
