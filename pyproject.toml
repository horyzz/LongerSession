[project]
name = "longersession"
version = "0.1.0"
description = "超长 session 索引架构：单链表 session + 语义切割 + topic 索引"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
encoder = [
    "sentence-transformers>=2.6",
    "torch>=2.2",
    "modelscope>=1.14",
]
train = [
    "sentence-transformers>=2.6",
    "torch>=2.2",
    "datasets>=3.0",
    "accelerate>=1.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 默认走清华 PyPI 镜像（国内直连，不依赖代理）
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/longersession"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
